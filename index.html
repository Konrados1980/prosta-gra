<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot nad Rzeką</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b2330; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; overflow: hidden; }
  canvas { display: block; background: #2f7d32; border: 2px solid #0d1117; border-radius: 6px;
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stopka { margin: 0; font-size: 13px; opacity: .85; text-align: center; padding: 0 8px; }
  #stopka button { font: inherit; padding: 2px 10px; margin-left: 6px; border-radius: 4px; border: 1px solid #556; background: #2b3545; color: #eee; cursor: pointer; }
  /* na pełnym ekranie chowamy stopkę, żeby gra zajęła cały monitor */
  :fullscreen #stopka { display: none; }
  :fullscreen canvas { border: none; border-radius: 0; }

  /* Panel menu i wyników (nad planszą) */
  #panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; }
  #panel.ukryty { display: none; }
  .okno { background: rgba(14, 20, 32, .93); border: 1px solid #3a4a63; border-radius: 12px; padding: 18px 22px; width: min(560px, 100%);
          max-height: 100%; overflow: auto; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .okno h1 { margin: 0 0 12px; font-size: 28px; text-align: center; }
  .okno h2 { margin: 16px 0 6px; font-size: 17px; color: #ffd54a; }
  .okno p { margin: 6px 0; font-size: 14px; line-height: 1.45; opacity: .9; }
  .rzad { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .okno button { font: inherit; font-size: 15px; padding: 7px 14px; border-radius: 6px; border: 1px solid #4b5d7a; background: #24324a; color: #eee; cursor: pointer; }
  .okno button:hover { background: #2f4263; }
  .okno button.wybrany { background: #1e88e5; border-color: #90caf9; }
  .okno button.glowny { background: #2e7d32; border-color: #81c784; font-weight: bold; font-size: 17px; }
  .okno input { font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 6px; border: 1px solid #4b5d7a; background: #0f1724; color: #fff; width: 170px; }
  .okno table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .okno td, .okno th { padding: 4px 6px; text-align: left; border-bottom: 1px solid #263248; }
  .okno th { color: #9fb3d1; font-weight: normal; font-size: 13px; }
  .okno td.liczba, .okno th.liczba { text-align: right; }
  .okno tr.zwyciezca td { color: #ffd54a; font-weight: bold; }
  .nowy { color: #69f0ae; font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<canvas id="gra" width="480" height="640"></canvas>
<p id="stopka">Strzałki: lot · Spacja lub X: strzał · P: pauza · Enter: start · F: pełny ekran
  <button id="pelnyEkran" type="button">⛶ Pełny ekran</button>
  <br><small>Telefon: przesuwaj palcem po ekranie gry · wersja 1.9 (nowa grafika)</small></p>
<div id="panel" class="ukryty"><div class="okno" id="okno"></div></div>

<script>
// ===== Ustawienia =====
const canvas = document.getElementById('gra');
const ctx = canvas.getContext('2d');
const SEG = 160;          // długość jednego odcinka rzeki (w pikselach świata)

// ===== Rozmiar planszy =====
// Wysokość planszy jest stała (640), a szerokość dopasowujemy do kształtu okna,
// więc na szerokim monitorze widać więcej brzegów i rzeka ma więcej miejsca na zakręty.
const H = 640;
let W = 480;
let renderScale = 1;      // ile pikseli ekranu przypada na 1 jednostkę gry
const MIN_W = 480, MAX_W = 1280;
function resize() {
  const footer = document.fullscreenElement ? 0 : document.getElementById('stopka').offsetHeight + 16;
  const availW = innerWidth - 8, availH = innerHeight - footer - 8;
  const oldW = W;
  W = Math.round(Math.max(MIN_W, Math.min(MAX_W, H * availW / availH)));
  if (oldW !== W && segments) recenterWorld(oldW);
  const scale = Math.min(availW / W, availH / H);       // powiększamy planszę, żeby wypełniła okno
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  // Rysujemy w prawdziwej rozdzielczości ekranu (ostro, bez widocznych pikseli),
  // a gra dalej liczy wszystko w swoich jednostkach W × H.
  renderScale = Math.min(2.5, scale * (devicePixelRatio || 1));
  canvas.width = Math.round(W * renderScale); canvas.height = Math.round(H * renderScale);
  if (plane) plane.x = Math.min(plane.x, W - 15);
}
// Po zmianie szerokości okna przesuwamy cały świat tak, żeby rzeka została na środku planszy
// (inaczej po zwężeniu okna rzeka mogłaby uciec poza ekran).
function recenterWorld(oldW) {
  const dx = (W - oldW) / 2;
  for (const s of segments) {
    s.c += dx;
    s.c = Math.max(s.w + 15, Math.min(W - s.w - 15, s.c));   // rzeka musi się zmieścić
  }
  for (const list of [obstacles, rings, cannons, balls, bullets, particles, popups]) {
    for (const o of list || []) { o.x += dx; if (o.bx !== undefined) o.bx += dx; }
  }
  if (plane) { plane.x += dx; plane.px = plane.x; }
  if (drag) drag = null;
  if (state === 'play') invuln = Math.max(invuln, 1.5);     // chwila ochrony po zmianie okna
}
addEventListener('resize', resize);
document.addEventListener('fullscreenchange', resize);

// Pełny ekran: klawisz F albo przycisk pod grą
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.getElementById('pelnyEkran').addEventListener('click', e => { toggleFullscreen(); e.currentTarget.blur(); });

// ===== Stan gry =====
let state = 'menu';       // 'menu' | 'play' | 'pause' | 'next' (między turami) | 'results'
let cam, plane, lives, score, bonus, obstacles, rings, particles, segments, invuln, nextSpawn;
let gt = 0;               // czas gry w sekundach (do animacji przeszkód)
let bullets, shotCd;      // pociski samolotu i czas do następnego strzału
let popups = [];          // unoszące się napisy z punktami
let cannons = [], balls = [], nextCannon = 0;   // armatki na brzegu i ich kule
const SHOT_DELAY = 0.2;   // co ile sekund można strzelić (przy trzymanej Spacji)
const SHOT_SPEED = 550;   // jak szybko pocisk leci w górę ekranu

// Klawisze zapisujemy po e.code (fizyczny klawisz), więc działa przy każdym układzie klawiatury
const keys = {};
let wantShot = false;     // krótkie stuknięcie Spacji/X też odda strzał
const isShotKey = c => c === 'Space' || c === 'KeyX';
addEventListener('keydown', e => {
  const enter = e.code === 'Enter' || e.code === 'NumpadEnter';
  // Podczas wpisywania imienia klawisze nie sterują grą (poza Enterem = start)
  if (e.target.tagName === 'INPUT') {
    if (enter) { e.preventDefault(); startFromMenu(); }
    return;
  }
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || isShotKey(e.code)) e.preventDefault();
  if (isShotKey(e.code) && !e.repeat && state === 'play') wantShot = true;
  if (enter && !e.repeat) {
    e.preventDefault();
    if (state === 'menu') startFromMenu();
    else if (state === 'next') startTurn();
    else if (state === 'results') startRound();
  }
  if (e.code === 'KeyF') toggleFullscreen();
  // M: powrót do menu (zmiana graczy i imion) z pauzy, między turami albo z wyników
  if (e.code === 'KeyM' && (state === 'pause' || state === 'next' || state === 'results')) showMenu();
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) {
    state = state === 'play' ? 'pause' : 'play';
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
// Po przełączeniu okna klawisze mogłyby "utknąć" wciśnięte
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ===== Sterowanie dotykiem (działa też myszą) =====
// Przesuwasz palec w dowolnym miejscu gry, a samolot przesuwa się o tyle samo,
// więc palec nie zasłania samolotu.
let drag = null;   // { px, py, ax, ay } = gdzie był palec i samolot na początku ruchu
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function anchorDrag(p) { drag = { px: p.x, py: p.y, ax: plane.x, ay: plane.y, tx: plane.x, ty: plane.y }; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (state === 'next') startTurn();
  else if (state === 'pause') state = 'play';
  else if (state !== 'play') return;
  anchorDrag(pointerPos(e));
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pointerPos(e);
  drag.tx = drag.ax + (p.x - drag.px);
  drag.ty = drag.ay + (p.y - drag.py);
  drag.last = p;
});
// po puszczeniu palca samolot jeszcze dolatuje do wskazanego miejsca
const endDrag = () => { if (drag) drag.released = true; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// Pauza, gdy przełączysz kartę lub aplikację na telefonie
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') state = 'pause';
});

// ===== Rzeka =====
// Każdy odcinek ma: c = środek, w = połowa szerokości, iw = połowa szerokości wyspy (0 = brak)
function makeSegment(i) {
  // na szerszym ekranie rzeka jest trochę szersza (najwyżej 1,4 raza)
  const k = Math.max(1, Math.min(1.4, Math.sqrt(W / MIN_W)));
  if (i < 4) return { c: W / 2, w: 170 * k, iw: 0 };
  const hard = Math.min(i / 120, 1);                 // trudność rośnie z dystansem
  const w = (75 + Math.random() * (120 - 50 * hard)) * k;  // szerokość rzeki
  const margin = 15;
  const prev = segments[i - 1];
  // środek przesuwa się najwyżej o 80 px na odcinek, żeby dało się nadążyć za zakrętem
  const minC = w + margin, maxC = W - w - margin;
  // i jest lekko ściągany w stronę środka ekranu, żeby rzeka nie uciekała pod sam brzeg planszy
  const drift = (Math.random() * 2 - 1) * 80 + (W / 2 - prev.c) * 0.15;
  const c = Math.max(minC, Math.min(maxC, prev.c + Math.max(-80, Math.min(80, drift))));
  let iw = 0;
  if (w > 120 && Math.random() < 0.35 + 0.2 * hard) iw = Math.min(w * 0.4, w - 55);
  return { c, w, iw };
}
function seg(i) {
  i = Math.max(0, i);       // przed startem (poniżej ekranu) rzeka wygląda jak na początku
  while (segments.length <= i) segments.push(makeSegment(segments.length));
  return segments[i];
}
function riverAt(wy) {
  const i = Math.floor(wy / SEG);
  let t = (wy - i * SEG) / SEG;
  t = t * t * (3 - 2 * t);                           // płynne przejście
  const a = seg(i), b = seg(i + 1);
  return { c: a.c + (b.c - a.c) * t, w: a.w + (b.w - a.w) * t, iw: a.iw + (b.iw - a.iw) * t };
}
function inWater(x, wy) {
  const r = riverAt(wy), d = Math.abs(x - r.c);
  return d < r.w && (r.iw < 1 || d > r.iw);   // iw < 1 = brak wyspy
}
// Losowy punkt w wodzie (w lewym lub prawym kanale, jeśli jest wyspa)
function randomWaterX(wy, pad) {
  const r = riverAt(wy);
  if (r.iw < 3) return r.c - r.w + pad + Math.random() * Math.max(0, 2 * (r.w - pad));
  const chW = r.w - r.iw - 2 * pad;
  const left = Math.random() < 0.5;
  const start = left ? r.c - r.w + pad : r.c + r.iw + pad;
  return start + Math.random() * Math.max(0, chW);
}
// ===== Przeszkody =====
// hp = ile trafień wytrzyma, pts = punkty za rozbicie, color = kolor napisu z punktami
const TYPES = {
  rock:    { name: 'Skała', hp: 1, pts: 10, color: '#eeeeee' },
  log:     { name: 'Pień',  hp: 1, pts: 15, color: '#e6c08f' },
  buoy:    { name: 'Boja',  hp: 1, pts: 20, color: '#ff8a80' },
  whirl:   { name: 'Wir',   hp: 2, pts: 25, color: '#84ffff' },
  boulder: { name: 'Głaz',  hp: 3, pts: 50, color: '#ffab40' },
};
// Przeszkody stawiamy tylko na szerokich fragmentach rzeki i zawsze z wolnym przejazdem obok.
const MIN_WIDTH = 190;   // minimalna szerokość wody (bez wyspy), żeby postawić przeszkodę
const FREE_GAP = 80;     // tyle wolnej wody musi zostać obok przeszkody

// rzeka musi być szeroka w całej okolicy przeszkody, a nie tylko w jednym punkcie
function wideRiver(wy) {
  for (let d = -80; d <= 80; d += 20) {
    const r = riverAt(wy + d);
    if (r.iw > 0.5 || 2 * r.w < MIN_WIDTH) return false;
  }
  return true;
}
// Losuje rodzaj przeszkody; im dalej, tym więcej trudniejszych
function pickType() {
  const p = Math.min(cam / 15000, 1);
  const w = {
    rock: 5 - 2 * p,
    log: 0.8 + 2 * p,
    buoy: 0.6 + 2 * p,
    boulder: cam > 1500 ? 0.4 + 1.6 * p : 0,
    whirl: cam > 3000 ? 0.3 + 1.2 * p : 0,
  };
  let sum = 0;
  for (const k in w) sum += w[k];
  let roll = Math.random() * sum;
  for (const k in w) { roll -= w[k]; if (roll <= 0) return k; }
  return 'rock';
}
// Losuje x tak, żeby przeszkoda o połowie szerokości "half" zostawiła wolny przejazd
function freeX(r, half) {
  for (let tries = 0; tries < 8; tries++) {
    const x = r.c - r.w + half + 6 + Math.random() * (2 * r.w - 2 * half - 12);
    const gapLeft = (x - half) - (r.c - r.w), gapRight = (r.c + r.w) - (x + half);
    if (Math.max(gapLeft, gapRight) >= FREE_GAP) return x;
  }
  return null;
}
function makeObstacle(wy) {
  if (!wideRiver(wy)) return null;
  const type = pickType();
  const o = { type, wy, hp: TYPES[type].hp, flash: 0 };
  let half;
  if (type === 'rock')    { o.r = 10 + Math.random() * 8; half = o.r; }
  if (type === 'boulder') { o.r = 22 + Math.random() * 4; half = o.r; }
  if (type === 'buoy')    { o.r = 9; o.amp = 25 + Math.random() * 15; o.ph = Math.random() * 6.3; half = o.r + o.amp; }
  if (type === 'log')     { o.r = 6; o.len = 46 + Math.random() * 20; o.vx = (Math.random() < 0.5 ? -1 : 1) * (30 + Math.random() * 30); half = o.len / 2 + o.r; }
  if (type === 'whirl')   { o.r = 16; o.pull = 90; o.spin = Math.random() * 6.3; half = o.r; }
  const x = freeX(riverAt(wy), half);
  if (x === null) return null;
  o.x = x; o.bx = x;
  return o;
}
// Ruch przeszkód: boje kołyszą się na boki, pnie dryfują i odbijają od brzegów, wiry się kręcą
function moveObstacles(dt) {
  for (const o of obstacles) {
    o.flash = Math.max(0, o.flash - dt);
    if (o.type === 'buoy') o.x = o.bx + Math.sin(gt * 1.6 + o.ph) * o.amp;
    if (o.type === 'whirl') o.spin += dt * 3;
    if (o.type === 'log') {
      o.x += o.vx * dt;
      const half = o.len / 2 + o.r;
      if (!inWater(o.x - half, o.wy) || !inWater(o.x + half, o.wy)) { o.x -= o.vx * dt; o.vx = -o.vx; }
    }
  }
}
// Odległość punktu od krawędzi przeszkody (ujemna = w środku)
function bodyDist(o, x, wy) {
  if (o.type === 'log') {
    const dx = Math.max(Math.abs(x - o.x) - o.len / 2, 0);
    return Math.hypot(dx, wy - o.wy) - o.r;
  }
  return Math.hypot(x - o.x, wy - o.wy) - o.r;
}
function channelCenter(wy) {
  const r = riverAt(wy);
  return r.iw < 3 ? r.c : (r.c - r.w + r.c - r.iw) / 2;
}

// Zamiana współrzędnych: świat (wy rośnie w górę) -> ekran
const toScreenY = wy => H - (wy - cam);
const toWorldY = sy => cam + (H - sy);

// ===== Nowa gra =====
function newGame() {
  cam = 0; lives = 3; score = 0; bonus = 0;
  obstacles = []; rings = []; particles = []; segments = []; gt = 0;
  cannons = []; balls = []; nextCannon = CANNON_START;
  bullets = []; shotCd = 0; wantShot = false; popups = [];
  plane = { x: W / 2, y: H - 110, roll: 0, boost: 0 };
  invuln = 1.5; nextSpawn = 400;
  state = 'play';
}

// ===== Logika =====
function update(dt) {
  // Sterowanie: lewo/prawo = na boki, góra/dół = do przodu/do tyłu
  const side = 260, fwd = 200;
  if (keys.ArrowLeft) plane.x -= side * dt;
  if (keys.ArrowRight) plane.x += side * dt;
  if (keys.ArrowUp) plane.y -= fwd * dt;
  if (keys.ArrowDown) plane.y += fwd * dt;
  if (drag) {
    // samolot goni pozycję palca, ale nie szybciej niż przy strzałkach (×1.3)
    const dx = drag.tx - plane.x, dy = drag.ty - plane.y;
    const mx = side * 1.3 * dt, my = fwd * 1.3 * dt;
    plane.x += Math.max(-mx, Math.min(mx, dx));
    plane.y += Math.max(-my, Math.min(my, dy));
    if (drag.released && Math.abs(dx) <= mx && Math.abs(dy) <= my) drag = null;
  }
  // Wiry wciągają samolot do środka (da się wyrwać, lecąc w bok)
  for (const o of obstacles) {
    if (o.type !== 'whirl') continue;
    const dx = plane.x - o.x, dy = plane.y - toScreenY(o.wy), d = Math.hypot(dx, dy);
    if (d < o.pull && d > 1) {
      const f = 120 * (1 - d / o.pull);
      plane.x -= dx / d * f * dt;
      plane.y -= dy / d * f * dt;
    }
  }
  // Przechył skrzydeł przy skręcaniu (tylko wygląd): liczony z tego, jak szybko samolot leci w bok
  const vx = (plane.x - (plane.px ?? plane.x)) / Math.max(dt, 1e-6);
  plane.roll += (Math.max(-1, Math.min(1, vx / 260)) - plane.roll) * Math.min(1, dt * 10);
  plane.boost = keys.ArrowUp ? 1 : 0;
  plane.x = Math.max(15, Math.min(W - 15, plane.x));
  plane.px = plane.x;
  plane.y = Math.max(120, Math.min(H - 40, plane.y));

  // Prędkość: rośnie z dystansem, a lot "do przodu" dodatkowo przyspiesza
  const base = Math.min(110 + cam * 0.012, 300);
  const speed = base + (H - 40 - plane.y) * 0.35;
  cam += speed * dt;
  gt += dt;
  score = Math.floor(cam / 10) + bonus;
  moveObstacles(dt);

  // Strzelanie: Spacja albo X (można trzymać)
  shotCd -= dt;
  if ((keys.Space || keys.KeyX || wantShot) && shotCd <= 0) {
    bullets.push({ x: plane.x, wy: toWorldY(plane.y - 18) });
    shotCd = SHOT_DELAY;
    wantShot = false;
  }
  // Pociski lecą w górę; znikają poza ekranem albo nad lądem
  for (const b of bullets) {
    b.wy += (speed + SHOT_SPEED) * dt;
    if (toScreenY(b.wy) < 34) { b.dead = true; continue; }
    // armatki stoją na brzegu, więc sprawdzamy je przed lądem
    const cn = cannons.find(c => !c.dead && Math.hypot(c.x - b.x, c.wy - b.wy) < 18);
    if (cn) { hitCannon(cn, b); continue; }
    const ball = balls.find(k => !k.dead && Math.hypot(k.x - b.x, k.wy - b.wy) < BALL_R + 5);
    if (ball) {
      ball.dead = true; b.dead = true; bonus += BALL_POINTS;
      burst(ball.x, toScreenY(ball.wy), '#bdbdbd', 10);
      popup(ball.x, toScreenY(ball.wy), '+' + BALL_POINTS, '#bdbdbd', 18);
      continue;
    }
    if (!inWater(b.x, b.wy)) { b.dead = true; burst(b.x, toScreenY(b.wy), '#a1887f', 5); continue; }
    const o = obstacles.find(o => !o.dead && bodyDist(o, b.x, b.wy) < (o.type === 'whirl' ? 8 : 4));
    if (o) hitObstacle(o, b);
  }
  bullets = bullets.filter(b => !b.dead);
  obstacles = obstacles.filter(o => !o.dead);

  updateCannons(dt);

  // Nowe przeszkody i gwiazdki pojawiają się nad ekranem
  while (nextSpawn < cam + H + 60) {
    const wy = nextSpawn;
    const o = Math.random() < 0.55 ? makeObstacle(wy) : null;
    if (o) obstacles.push(o);
    else rings.push({ x: randomWaterX(wy, 20), wy, got: false });
    nextSpawn += Math.max(90, 220 - cam * 0.004) * (0.6 + Math.random() * 0.8);
  }
  obstacles = obstacles.filter(o => toScreenY(o.wy) < H + 60);
  rings = rings.filter(o => toScreenY(o.wy) < H + 40 && !o.got);

  // Gwiazdki: +25 pkt za przelot
  const pwy = toWorldY(plane.y);
  for (const g of rings) {
    if (Math.hypot(g.x - plane.x, g.wy - pwy) < 26) {
      g.got = true; bonus += 25;
      burst(g.x, toScreenY(g.wy), '#ffd54a', 14);
      popup(g.x, toScreenY(g.wy), '+25', '#ffd54a');
    }
  }
  // Napisy z punktami unoszą się do góry i znikają
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  // Zderzenia (gdy nie ma chwilowej ochrony)
  if (invuln > 0) { invuln -= dt; }
  else {
    const pts = [[0, -16], [-15, 2], [15, 2], [0, 12], [-6, 12], [6, 12]];
    let hit = pts.some(([dx, dy]) => !inWater(plane.x + dx, toWorldY(plane.y + dy)));
    if (!hit) hit = obstacles.some(o => o.type !== 'whirl' && bodyDist(o, plane.x, pwy) < 11);
    if (!hit) hit = balls.some(k => Math.hypot(k.x - plane.x, k.wy - pwy) < BALL_R + 11);
    if (hit) crash();
  }

  // Cząsteczki (wybuchy, błyski)
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

function crash() {
  explosion(plane.x, plane.y);
  lives--;
  if (lives <= 0) {
    endTurn();
    return;
  }
  // Odrodzenie na środku kanału i usunięcie pobliskich skał
  plane.y = H - 110;
  const wy = toWorldY(plane.y);
  plane.x = channelCenter(wy);
  obstacles = obstacles.filter(o => Math.abs(o.wy - wy) > 250);
  balls = [];
  for (const c of cannons) c.cd = Math.max(c.cd, 2);   // armatki dają chwilę na otrząśnięcie się
  invuln = 2;
  // palec dalej na ekranie: liczymy ruch od nowa; palec puszczony: zatrzymujemy samolot
  if (drag && !drag.released && drag.last) anchorDrag(drag.last);
  else drag = null;
}

// ===== Armatki na brzegu =====
const CANNON_START = 2000;    // pierwsza armatka po ok. 200 punktach dystansu
const CANNON_HP = 2, CANNON_POINTS = 40, BALL_POINTS = 5;
const BALL_R = 6, BALL_SPEED = 190;
const CHARGE_TIME = 0.6;      // tyle sekund lufa świeci na czerwono przed strzałem

// Stawia armatkę na lądzie tuż przy brzegu (lewym albo prawym), lufą w stronę rzeki
function makeCannon(wy) {
  const r = riverAt(wy);
  const sides = Math.random() < 0.5 ? [-1, 1] : [1, -1];
  for (const side of sides) {
    const x = side < 0 ? r.c - r.w - 22 : r.c + r.w + 22;
    if (x < 20 || x > W - 20) continue;
    // cała armatka musi stać na lądzie, także trochę wyżej i niżej
    if ([-16, 0, 16].some(d => inWater(x - 14, wy + d) || inWater(x + 14, wy + d))) continue;
    // cd = czas do pierwszego strzału (zawsze dłuższy niż czerwone ostrzeżenie)
    return { x, wy, dir: -side, hp: CANNON_HP, cd: CHARGE_TIME + 0.1 + Math.random() * 0.5, flash: 0 };
  }
  return null;
}

function updateCannons(dt) {
  // nowe armatki: coraz częściej im dalej lecisz
  while (cam > CANNON_START - H && nextCannon < cam + H + 60) {
    const c = makeCannon(nextCannon);
    if (c) cannons.push(c);
    nextCannon += Math.max(500, 1300 - cam * 0.01) * (0.7 + Math.random() * 0.6);
  }
  for (const c of cannons) {
    c.flash = Math.max(0, c.flash - dt);
    const sy = toScreenY(c.wy);
    // strzela tylko, gdy jest na ekranie i wyraźnie przed samolotem (uczciwie: widzisz ją wcześniej)
    if (sy < 60 || sy > plane.y - 60) continue;
    c.cd -= dt;
    if (c.cd <= 0) {
      balls.push({ x: c.x + c.dir * 22, wy: c.wy, vx: c.dir * BALL_SPEED, wet: false });
      burst(c.x + c.dir * 22, sy, '#ffcc80', 8);
      c.cd = 2.2 + Math.random() * 1.3;
    }
  }
  // kule lecą poziomo przez rzekę i rozbijają się na drugim brzegu albo na wyspie
  for (const k of balls) {
    k.x += k.vx * dt;
    const water = inWater(k.x, k.wy);
    if (water) k.wet = true;
    if (k.x < -20 || k.x > W + 20) k.dead = true;
    else if (k.wet && !water) { k.dead = true; burst(k.x, toScreenY(k.wy), '#a1887f', 8); }
  }
  balls = balls.filter(k => !k.dead && toScreenY(k.wy) < H + 20);
  cannons = cannons.filter(c => !c.dead && toScreenY(c.wy) < H + 40);
}

function hitCannon(c, b) {
  const sy = toScreenY(c.wy);
  b.dead = true;
  c.hp--; c.flash = 0.12;
  if (c.hp > 0) { burst(b.x, sy, '#ffffff', 6); return; }
  c.dead = true;
  bonus += CANNON_POINTS;
  explosion(c.x, sy);
  popup(c.x, sy, '+' + CANNON_POINTS, '#ff7043', 30);
}

// Trafienie przeszkody: odejmuje 1 punkt wytrzymałości; przy zerze przeszkoda pęka i daje punkty
function hitObstacle(o, b) {
  const T = TYPES[o.type], sy = toScreenY(o.wy);
  b.dead = true;
  o.hp--; o.flash = 0.12;
  if (o.hp > 0) { burst(b.x, sy, '#ffffff', 6); return; }
  o.dead = true;
  bonus += T.pts;
  burst(o.x, sy, T.color, 14 + T.pts / 2);
  popup(o.x, sy, '+' + T.pts, T.color, T.pts >= 25 ? 30 : 24);
}

// Napis z punktami: pojawia się duży i szybko maleje do normalnego rozmiaru
function popup(x, y, text, color, size = 22) { popups.push({ x, y, text, color, size, life: 1 }); }

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, color, size: 1.5 + Math.random() * 2.5 });
  }
}
// Duży wybuch: błysk, rozchodzący się pierścień, ogień i dym
function explosion(x, y) {
  particles.push({ x, y, vx: 0, vy: 0, life: 0.5, ring: true });
  burst(x, y, '#fff59d', 10);
  burst(x, y, '#ff9800', 18);
  burst(x, y, '#e64a19', 14);
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, v = 15 + Math.random() * 40;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: 0.8 + Math.random() * 0.5, color: '#616161', size: 5 + Math.random() * 5, smoke: true });
  }
}

// ===== Rysowanie =====
// Stała "losowość": ta sama liczba dla tego samego miejsca, więc drzewa i fale nie skaczą
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

// Kontur rzeki: lewy brzeg z góry na dół, prawy z dołu do góry; "half" mówi, jak szeroko
function riverPath(rows, half) {
  ctx.beginPath();
  rows.forEach((p, i) => { const x = p.r.c - half(p.r); i ? ctx.lineTo(x, p.y) : ctx.moveTo(x, p.y); });
  for (let i = rows.length - 1; i >= 0; i--) ctx.lineTo(rows[i].r.c + half(rows[i].r), rows[i].y);
  ctx.closePath();
}
function edgeLine(rows, xOf) {
  ctx.beginPath();
  rows.forEach((p, i) => { const x = xOf(p.r); i ? ctx.lineTo(x, p.y) : ctx.moveTo(x, p.y); });
}

function drawWorld() {
  const anim = performance.now() / 1000;
  // Ląd: trawa z jaśniejszymi i ciemniejszymi kępami
  ctx.fillStyle = '#3d8b3d';
  ctx.fillRect(0, 0, W, H);
  const PATCH = 70;
  for (let i = Math.floor(cam / PATCH) - 1; i <= Math.floor((cam + H) / PATCH) + 1; i++) {
    for (let k = 0; k < 3 + W / 300; k++) {
      const x = hash(i, k) * W, sy = toScreenY(i * PATCH + hash(i, k + 9) * PATCH);
      ctx.fillStyle = hash(i, k + 3) < 0.5 ? 'rgba(0,60,0,.13)' : 'rgba(170,220,120,.10)';
      ctx.beginPath(); ctx.ellipse(x, sy, 20 + hash(i, k + 5) * 30, 12 + hash(i, k + 7) * 16, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Punkty brzegu co 6 jednostek (z zapasem poza ekranem)
  const rows = [];
  for (let y = -12; y <= H + 12; y += 6) rows.push({ y, r: riverAt(toWorldY(y)) });

  // Piaszczysta plaża, woda, głębia na środku
  riverPath(rows, r => r.w + 8);  ctx.fillStyle = '#d9c48f'; ctx.fill();
  riverPath(rows, r => r.w + 3);  ctx.fillStyle = '#b8a26a'; ctx.fill();
  riverPath(rows, r => r.w);      ctx.fillStyle = '#2196f3'; ctx.fill();
  riverPath(rows, r => r.w * 0.6); ctx.fillStyle = 'rgba(13,71,161,.28)'; ctx.fill();
  riverPath(rows, r => r.w * 0.3); ctx.fillStyle = 'rgba(13,71,161,.18)'; ctx.fill();
  // Piana przy brzegach
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  edgeLine(rows, r => r.c - r.w + 1); ctx.stroke();
  edgeLine(rows, r => r.c + r.w - 1); ctx.stroke();

  // Fale: krótkie jasne łuki, które lekko się kołyszą
  const WAVE = 44;
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = Math.floor(cam / WAVE) - 1; i <= Math.floor((cam + H) / WAVE) + 1; i++) {
    for (let k = 0; k < 4; k++) {
      const wy = i * WAVE + hash(i, k + 20) * WAVE, r = riverAt(wy);
      const x = r.c + (hash(i, k + 30) * 2 - 1) * r.w * 0.8 + Math.sin(anim * 1.5 + i + k) * 4;
      if (!inWater(x - 10, wy) || !inWater(x + 10, wy)) continue;
      const sy = toScreenY(wy);
      ctx.beginPath(); ctx.arc(x, sy - 6, 8, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
    }
  }

  // Wyspy: każdy ciągły kawałek z wyspą rysujemy jako osobny gładki kształt
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      riverPath(run, r => r.iw + 6 * Math.min(1, r.iw / 6)); ctx.fillStyle = '#d9c48f'; ctx.fill();   // końce wyspy zwężają się w szpic
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2.5; ctx.stroke();
      riverPath(run, r => Math.max(0, r.iw - 1)); ctx.fillStyle = '#3d8b3d'; ctx.fill();
    }
    run = [];
  };
  for (const p of rows) { if (p.r.iw > 0.5) run.push(p); else flush(); }
  flush();

  drawTrees();
  // Przeszkody (wiry najpierw, bo leżą "pod" resztą)
  for (const o of obstacles) if (o.type === 'whirl') drawObstacle(o);
  for (const o of obstacles) if (o.type !== 'whirl') drawObstacle(o);
  for (const c of cannons) drawCannon(c);
  for (const k of balls) {
    const sy = toScreenY(k.wy);
    ctx.fillStyle = 'rgba(255,255,255,.35)';                          // smuga za kulą
    ctx.fillRect(k.vx > 0 ? k.x - 22 : k.x, sy - 2, 22, 4);
    circle(k.x, sy, BALL_R, '#212121');
    circle(k.x - 2, sy - 2, 2, '#757575');
  }
  // Złote gwiazdki (nagroda: zbierasz je przelotem)
  const t = performance.now() / 1000;
  for (const g of rings) drawStar(g.x, toScreenY(g.wy), 16, t * 2 + g.x);
  // Pociski: świecące smugi
  ctx.save();
  ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 8; ctx.lineCap = 'round';
  for (const b of bullets) {
    const sy = toScreenY(b.wy);
    const g = ctx.createLinearGradient(0, sy - 8, 0, sy + 10);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#fff176'); g.addColorStop(1, 'rgba(255,152,0,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x, sy - 8); ctx.lineTo(b.x, sy + 10); ctx.stroke();
  }
  ctx.restore();
}

// Drzewa na lądzie i na wyspach (z cieniem); stoją zawsze w tych samych miejscach świata
function drawTrees() {
  const ROW = 30;
  for (let i = Math.floor(cam / ROW) - 2; i <= Math.floor((cam + H) / ROW) + 2; i++) {
    const n = Math.round((2 + hash(i, 1) * 3) * W / 480);
    for (let k = 0; k < n; k++) {
      const x = hash(i, k + 40) * W, wy = i * ROW + hash(i, k + 60) * ROW;
      const size = 8 + hash(i, k + 80) * 9;
      // nie stawiamy drzew na plaży ani w wodzie
      const r = riverAt(wy), d = Math.abs(x - r.c);
      const onLand = d > r.w + size + 10, onIsland = r.iw > 0 && d < r.iw - size - 3;
      if (!onLand && !onIsland) continue;
      const y = toScreenY(wy);
      const dark = hash(i, k + 90) < 0.3;          // część drzew to ciemne iglaki
      circle(x + 5, y + 6, size, 'rgba(0,0,0,.22)');                         // cień
      circle(x, y, size, dark ? '#1b5e20' : '#2e7d32');
      circle(x - size * 0.25, y - size * 0.25, size * 0.65, dark ? '#2e7d32' : '#43a047');
      circle(x - size * 0.4, y - size * 0.4, size * 0.3, dark ? '#388e3c' : '#66bb6a');
    }
  }
}

function circle(x, y, r, color) {
  if (!(r > 0)) return;          // ujemny promień wywróciłby rysowanie (i zatrzymał grę)
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function drawCannon(c) {
  const x = c.x, y = toScreenY(c.wy), d = c.dir;
  ctx.fillStyle = '#5d4037';                                          // drewniana podstawa
  ctx.fillRect(x - 14, y - 10, 28, 20);
  // lufa: świeci na czerwono, gdy armatka zaraz wystrzeli
  const sy = y;
  const aiming = sy >= 60 && sy <= plane.y - 60 && c.cd < CHARGE_TIME;
  ctx.fillStyle = aiming && Math.floor(gt * 12) % 2 === 0 ? '#ff1744' : '#37474f';
  ctx.fillRect(d > 0 ? x : x - 24, y - 5, 24, 10);
  circle(x, y, 9, '#263238');                                         // korpus
  circle(x - 8, y + 10, 4, '#3e2723'); circle(x + 8, y + 10, 4, '#3e2723');   // kółka
  if (c.hp < CANNON_HP) { ctx.strokeStyle = '#ffab91'; ctx.lineWidth = 2;  // rysa po trafieniu
    ctx.beginPath(); ctx.moveTo(x - 5, y - 6); ctx.lineTo(x + 2, y); ctx.lineTo(x - 2, y + 6); ctx.stroke(); }
  if (c.flash > 0) { ctx.globalAlpha = 0.7; circle(x, y, 14, '#fff'); ctx.globalAlpha = 1; }
}

function drawObstacle(o) {
  const x = o.x, y = toScreenY(o.wy), r = o.r;
  if (o.type === 'rock') {
    circle(x, y, r, '#5d5d5d');
    circle(x - r * 0.3, y - r * 0.3, r * 0.45, '#8a8a8a');
  }
  if (o.type === 'boulder') {
    circle(x + 3, y + 4, r, 'rgba(0,0,0,.25)');            // cień
    circle(x, y, r, '#6d5c4d');
    circle(x - r * 0.3, y - r * 0.35, r * 0.5, '#8d7b6a');
    // rysy: im więcej trafień, tym więcej pęknięć
    const damage = TYPES.boulder.hp - o.hp;
    ctx.strokeStyle = '#2b2118'; ctx.lineWidth = 2;
    for (let i = 0; i < damage * 2; i++) {
      const a = i * 2.4 + 0.5;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5 + 3);
      ctx.lineTo(x + Math.cos(a + 0.3) * r * 0.95, y + Math.sin(a + 0.3) * r * 0.95);
      ctx.stroke();
    }
  }
  if (o.type === 'log') {
    const L = o.len / 2;
    ctx.fillStyle = '#6d4c41';
    ctx.beginPath(); ctx.roundRect(x - L, y - r, o.len, r * 2, r); ctx.fill();
    ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 1.5;                     // kora
    for (let i = -L + 10; i < L - 6; i += 12) { ctx.beginPath(); ctx.moveTo(x + i, y - r + 2); ctx.lineTo(x + i + 6, y + r - 2); ctx.stroke(); }
    circle(x - L + 2, y, r - 1, '#d7b48a'); circle(x + L - 2, y, r - 1, '#d7b48a');   // słoje na końcach
    circle(x - L + 2, y, r * 0.35, '#a1784e'); circle(x + L - 2, y, r * 0.35, '#a1784e');
  }
  if (o.type === 'buoy') {
    const tilt = Math.sin(gt * 3.2 + o.ph) * 0.25;
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    circle(0, 0, r, '#e53935');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-r, -3, r * 2, 6);
    circle(0, -r + 1, 3, '#263238');
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;        // fale wokół boi
    ctx.beginPath(); ctx.arc(x, y, r + 5 + Math.sin(gt * 4) * 2, 0, Math.PI * 2); ctx.stroke();
  }
  if (o.type === 'whirl') {
    ctx.fillStyle = 'rgba(13,71,161,.25)';                               // strefa wciągania
    ctx.beginPath(); ctx.arc(x, y, o.pull, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.7 - i * 0.2})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r + i * 12, o.spin + i * 2, o.spin + i * 2 + 4); ctx.stroke();
    }
    circle(x, y, r * 0.7 * (o.hp / TYPES.whirl.hp + 0.3), '#0d47a1');
  }
  // krótki biały błysk po trafieniu
  if (o.flash > 0) {
    ctx.globalAlpha = 0.7;
    if (o.type === 'log') { ctx.fillStyle = '#fff'; ctx.fillRect(x - o.len / 2, y - r, o.len, r * 2); }
    else circle(x, y, r, '#fff');
    ctx.globalAlpha = 1;
  }
}

// Pięcioramienna gwiazdka, która się obraca i lekko pulsuje
function drawStar(x, y, size, angle) {
  const s = size * (1 + 0.1 * Math.sin(angle * 2));
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.shadowColor = '#fff59d'; ctx.shadowBlur = 12;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? s : s * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffd54a'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// Napisy "+25", "+10" unoszące się po zdobyciu punktów
function drawPopups() {
  ctx.textAlign = 'center';
  for (const p of popups) {
    const grow = 1 + 0.8 * Math.max(0, (p.life - 0.85) / 0.15);   // na początku większy
    ctx.font = `bold ${Math.round(p.size * grow)}px system-ui, sans-serif`;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x + 1, p.y + 1);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// Nowoczesny odrzutowiec widziany z góry (nosem do góry). sx = zwężenie skrzydeł przy przechyle.
function jetPath(part, sx) {
  ctx.beginPath();
  if (part === 'body') {            // smukły kadłub ze szpiczastym nosem
    ctx.moveTo(0, -22);
    ctx.bezierCurveTo(3, -18, 4.5, -10, 4.5, -2);
    ctx.lineTo(4, 12); ctx.lineTo(2.5, 16); ctx.lineTo(-2.5, 16); ctx.lineTo(-4, 12);
    ctx.lineTo(-4.5, -2);
    ctx.bezierCurveTo(-4.5, -10, -3, -18, 0, -22);
  }
  if (part === 'wings') {           // skrzydła w kształcie delty, odchylone do tyłu
    ctx.moveTo(4, -6); ctx.lineTo(18 * sx, 7); ctx.lineTo(18 * sx, 10); ctx.lineTo(4, 7);
    ctx.closePath(); ctx.moveTo(-4, -6); ctx.lineTo(-18 * sx, 7); ctx.lineTo(-18 * sx, 10); ctx.lineTo(-4, 7);
  }
  if (part === 'canards') {         // małe przednie skrzydełka
    ctx.moveTo(3.5, -12); ctx.lineTo(8 * sx, -8); ctx.lineTo(3.8, -7);
    ctx.closePath(); ctx.moveTo(-3.5, -12); ctx.lineTo(-8 * sx, -8); ctx.lineTo(-3.8, -7);
  }
  if (part === 'tail') {            // statecznik z tyłu
    ctx.moveTo(3, 9); ctx.lineTo(9 * sx, 15); ctx.lineTo(9 * sx, 17); ctx.lineTo(2.5, 15.5);
    ctx.closePath(); ctx.moveTo(-3, 9); ctx.lineTo(-9 * sx, 15); ctx.lineTo(-9 * sx, 17); ctx.lineTo(-2.5, 15.5);
  }
  ctx.closePath();
}

function drawPlane() {
  if (invuln > 0 && Math.floor(invuln * 10) % 2 === 0) return;   // miganie podczas ochrony
  const { x, y } = plane, roll = plane.roll || 0;
  const sx = 1 - Math.abs(roll) * 0.28;                // przechylone skrzydła wyglądają na krótsze

  // Cień na wodzie (przesunięty, jakby słońce świeciło z lewej góry)
  ctx.save();
  ctx.translate(x + 16, y + 24); ctx.scale(0.85, 0.85); ctx.rotate(roll * 0.15);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  for (const p of ['wings', 'tail', 'canards', 'body']) { jetPath(p, sx); ctx.fill(); }
  ctx.restore();

  ctx.save();
  ctx.translate(x, y); ctx.rotate(roll * 0.15);

  // Płomień z silnika (dłuższy, gdy lecisz do przodu)
  const flame = 9 + Math.random() * 5 + (plane.boost || 0) * 8;
  const fg = ctx.createLinearGradient(0, 15, 0, 15 + flame);
  fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.25, '#ffeb3b'); fg.addColorStop(0.6, '#ff9800'); fg.addColorStop(1, 'rgba(255,87,34,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(-2.6, 15.5); ctx.quadraticCurveTo(0, 15 + flame * 1.1, 2.6, 15.5); ctx.fill();

  // Skrzydła i statecznik: szare z jaśniejszą krawędzią
  const wg = ctx.createLinearGradient(0, -6, 0, 12);
  wg.addColorStop(0, '#b0bec5'); wg.addColorStop(1, '#607d8b');
  ctx.fillStyle = wg; ctx.strokeStyle = '#37474f'; ctx.lineWidth = 0.8; ctx.lineJoin = 'round';
  jetPath('wings', sx); ctx.fill(); ctx.stroke();
  jetPath('tail', sx); ctx.fill(); ctx.stroke();
  jetPath('canards', sx); ctx.fill(); ctx.stroke();
  // pomarańczowe końcówki skrzydeł
  ctx.fillStyle = '#ff6d00';
  ctx.fillRect(18 * sx - 2.5, 6.5, 2.5, 3.5); ctx.fillRect(-18 * sx, 6.5, 2.5, 3.5);

  // Kadłub: biało-srebrny, z cieniowaniem z boków
  const bg = ctx.createLinearGradient(-5, 0, 5, 0);
  bg.addColorStop(0, '#90a4ae'); bg.addColorStop(0.45, '#ffffff'); bg.addColorStop(1, '#78909c');
  ctx.fillStyle = bg; ctx.strokeStyle = '#455a64';
  jetPath('body', sx); ctx.fill(); ctx.stroke();
  // pomarańczowy pas wzdłuż kadłuba
  ctx.strokeStyle = '#ff6d00'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, 13); ctx.stroke();

  // Kabina pilota: szklana, z odblaskiem
  const cg = ctx.createLinearGradient(0, -16, 0, -5);
  cg.addColorStop(0, '#b3e5fc'); cg.addColorStop(0.5, '#0288d1'); cg.addColorStop(1, '#01579b');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.ellipse(0, -10, 2.4, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.ellipse(-0.8, -12, 0.7, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawHud() {
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'left';  ctx.fillText('Punkty: ' + score, 10, 23);
  const rec = 'Rekord: ' + Math.max(bestScore(), score);
  if (players.length > 1 && players[turn]) {
    // kilku graczy: na środku imię, rekord w drugim, mniejszym wierszu
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a';
    ctx.fillText(`${players[turn].name} (${turn + 1}/${players.length})`, W / 2, 23);
    ctx.font = 'bold 14px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 34, 130, 22);
    ctx.fillStyle = '#ddd'; ctx.fillText(rec, 10, 50);
    ctx.font = 'bold 18px system-ui, sans-serif'; ctx.fillStyle = '#fff';
  } else {
    ctx.textAlign = 'center'; ctx.fillText(rec, W / 2, 23);
  }
  ctx.textAlign = 'right'; ctx.fillText('Życia: ' + '♥'.repeat(Math.max(lives, 0)), W - 10, 23);
}

function drawParticles() {
  for (const p of particles) {
    if (p.ring) {                                   // fala uderzeniowa
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.strokeStyle = '#fff3e0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (0.5 - p.life) * 140 + 6, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    if (p.smoke) {                                  // dym rośnie i blednie
      ctx.globalAlpha = Math.max(0, p.life * 0.5);
      circle(p.x, p.y, p.size * (2 - p.life), p.color);
      continue;
    }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.8));
    circle(p.x, p.y, (p.size || 2) * (0.5 + p.life), p.color);
  }
  ctx.globalAlpha = 1;
}

function overlay(title, lines) {
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.font = '18px system-ui, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 10 + i * 30));
}

function draw() {
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  drawWorld();
  if (state === 'play' || state === 'pause') drawPlane();
  drawParticles();
  drawPopups();
  if (state !== 'menu' && state !== 'results') drawHud();
  if (state === 'menu' || state === 'results') { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'pause') overlay('Pauza', ['Naciśnij P albo dotknij, aby grać dalej', 'M: menu (zmiana graczy i imion)']);
  if (state === 'next') {
    const prev = players[turn - 1], now = players[turn];
    overlay('Koniec tury', [
      `${prev.name}: ${prev.score} pkt`,
      '',
      `Teraz gra: ${now.name} (${turn + 1}/${players.length})`,
      'Enter albo dotknij, aby zacząć',
      'M: menu (zmiana graczy i imion)'
    ]);
  }
}

// ===== Pętla gry =====
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state === 'play') update(dt);
  else {
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  // nawet gdyby rysowanie kiedyś rzuciło błąd, pętla gry działa dalej
  requestAnimationFrame(loop);
  try { draw(); } catch (e) { console.error(e); }
}

// ===== Gracze, tury i tabela rekordów =====
// Gra dla 1–4 osób po kolei (każdy ma swoją turę z 3 życiami).
// Rekordy zapisują się w przeglądarce (localStorage), więc zostają po zamknięciu strony.
const TOP_KEY = 'lotNadRzeka_top', NAMES_KEY = 'lotNadRzeka_names';
let players = [{ name: 'Gracz 1', score: 0 }];
let turn = 0;
let menuCount = 1;
let menuNames = ['Gracz 1', 'Gracz 2', 'Gracz 3', 'Gracz 4'];
let topList = [];             // najlepsze wyniki: [{ name, score, date }]
let personal = {};        // rekord każdego gracza: { imię: punkty }
let lastRound = [];       // wyniki ostatniej rundy (do ekranu wyników)

function loadRecords() {
  try {
    const saved = JSON.parse(localStorage.getItem(TOP_KEY) || 'null');
    if (saved) { topList = saved.top || []; personal = saved.personal || {}; }
    else {
      // przeniesienie dawnego rekordu z wersji dla 1 gracza
      const old = Number(localStorage.getItem('lotNadRzeka_best')) || 0;
      if (old > 0) topList = [{ name: 'Dawny rekord', score: old, date: '' }];
    }
    const names = JSON.parse(localStorage.getItem(NAMES_KEY) || 'null');
    if (names) { menuCount = names.count || 1; names.list.forEach((n, i) => { if (n) menuNames[i] = n; }); }
  } catch (e) {}
}
function saveRecords() {
  try {
    localStorage.setItem(TOP_KEY, JSON.stringify({ top: topList, personal }));
    localStorage.setItem(NAMES_KEY, JSON.stringify({ count: menuCount, list: menuNames }));
  } catch (e) {}
}
const bestScore = () => (topList[0] ? topList[0].score : 0);
// zabezpieczenie: imię wstawiane do HTML nie może zawierać znaczników
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const panel = document.getElementById('panel'), okno = document.getElementById('okno');
function showPanel(html) { okno.innerHTML = html; panel.classList.remove('ukryty'); }
function hidePanel() { panel.classList.add('ukryty'); }

function topTable(limit, highlight = []) {
  if (!topList.length) return '<p>Jeszcze nikt nie zagrał. Bądź pierwszy!</p>';
  const rows = topList.slice(0, limit).map((t, i) =>
    `<tr${highlight.includes(t) ? ' class="zwyciezca"' : ''}><td>${i + 1}.</td><td>${esc(t.name)}</td><td class="liczba">${t.score}</td><td class="liczba">${esc(t.date)}</td></tr>`).join('');
  return `<table><tr><th>#</th><th>Gracz</th><th class="liczba">Punkty</th><th class="liczba">Data</th></tr>${rows}</table>`;
}

function showMenu() {
  state = 'menu';
  const countBtns = [1, 2, 3, 4].map(n => `<button type="button" data-n="${n}" class="${n === menuCount ? 'wybrany' : ''}">${n}</button>`).join('');
  const inputs = menuNames.slice(0, menuCount).map((n, i) =>
    `<label>Gracz ${i + 1}: <input data-i="${i}" maxlength="12" value="${esc(n)}"></label>`).join('');
  showPanel(`
    <h1>Lot nad Rzeką</h1>
    <div class="rzad">Liczba graczy: ${countBtns}</div>
    <div class="rzad">${inputs}</div>
    <p>Gracze grają po kolei, każdy ma 3 życia. Na końcu rundy zobaczycie wyniki i tabelę rekordów.</p>
    <div class="rzad"><button type="button" class="glowny" id="startBtn">▶ Start (Enter)</button></div>
    <h2>Sterowanie</h2>
    <p>← → na boki · ↑ szybciej · ↓ wolniej · Spacja lub X: strzał · P: pauza · F: pełny ekran</p>
    <h2>Punkty</h2>
    <p>gwiazdka 25 (przelotem) · skała 10 · pień 15 · boja 20 · wir 25 (2 trafienia, wciąga!) · głaz 50 (3 trafienia) ·
       armatka 40 (2 trafienia, czerwona lufa = zaraz strzeli) · kula z armatki 5</p>
    <h2>🏆 Najlepsze wyniki</h2>
    ${topTable(5)}
  `);
  okno.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { readNames(); menuCount = Number(b.dataset.n); showMenu(); });
  okno.querySelectorAll('input').forEach(inp => {
    inp.oninput = () => { menuNames[inp.dataset.i] = inp.value; };
    inp.onfocus = () => inp.select();   // kliknięcie zaznacza stare imię, więc od razu wpisujesz nowe
  });
  document.getElementById('startBtn').onclick = startFromMenu;
}
function readNames() { okno.querySelectorAll('input').forEach(inp => { menuNames[inp.dataset.i] = inp.value; }); }

function startFromMenu() {
  if (state !== 'menu') return;
  readNames();
  players = menuNames.slice(0, menuCount).map((n, i) => ({ name: n.trim() || `Gracz ${i + 1}`, score: 0 }));
  saveRecords();
  if (document.activeElement) document.activeElement.blur();   // żeby Spacja nie "klikała" przycisków
  startRound();
}
function startRound() {
  for (const p of players) p.score = 0;
  turn = 0;
  startTurn();
}
function startTurn() {
  hidePanel();
  for (const k in keys) keys[k] = false;
  newGame();
}
// Koniec tury: zapisujemy wynik i przechodzimy do następnego gracza albo do wyników
function endTurn() {
  const p = players[turn];
  p.score = score;
  p.newRecord = score > (personal[p.name] || 0);
  if (p.newRecord) personal[p.name] = score;
  const d = new Date();
  const entry = { name: p.name, score, date: `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}` };
  p.entry = entry;
  if (score > 0) { topList.push(entry); topList.sort((a, b) => b.score - a.score); topList = topList.slice(0, 10); }
  saveRecords();
  turn++;
  if (turn < players.length) state = 'next';
  else showResults();
}
function showResults() {
  state = 'results';
  lastRound = [...players].sort((a, b) => b.score - a.score);
  const rows = lastRound.map((p, i) =>
    `<tr${i === 0 && players.length > 1 ? ' class="zwyciezca"' : ''}><td>${i === 0 && players.length > 1 ? '🏆' : i + 1 + '.'}</td><td>${esc(p.name)}</td>` +
    `<td class="liczba">${p.score}</td><td class="liczba">${personal[p.name] || 0}${p.newRecord ? '<span class="nowy">nowy rekord!</span>' : ''}</td></tr>`).join('');
  showPanel(`
    <h1>${players.length > 1 ? 'Wyniki rundy' : 'Koniec gry'}</h1>
    <table><tr><th>#</th><th>Gracz</th><th class="liczba">Punkty</th><th class="liczba">Rekord gracza</th></tr>${rows}</table>
    <div class="rzad" style="margin-top:14px">
      <button type="button" class="glowny" id="againBtn">↻ Zagraj jeszcze raz (Enter)</button>
      <button type="button" id="menuBtn">✎ Zmień graczy / imiona (M)</button>
    </div>
    <h2>🏆 Najlepsze wyniki (top 10)</h2>
    ${topTable(10, players.map(p => p.entry))}
    <div class="rzad" style="margin-top:12px"><button type="button" id="clearBtn">Wyczyść rekordy</button></div>
  `);
  document.getElementById('againBtn').onclick = () => { document.activeElement.blur(); startRound(); };
  document.getElementById('menuBtn').onclick = showMenu;
  document.getElementById('clearBtn').onclick = () => {
    if (confirm('Na pewno usunąć wszystkie rekordy? Tego nie da się cofnąć.')) { topList = []; personal = {}; saveRecords(); showResults(); }
  };
}

resize();
loadRecords();
newGame();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
