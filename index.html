<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot nad Rzeką</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b2330; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  body { overflow: hidden; }
  canvas { background: #2f7d32; border: 3px solid #0d1117; border-radius: 6px; max-width: 95vw; max-height: 85vh; image-rendering: pixelated;
           touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  p { margin: 0; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<canvas id="gra" width="480" height="640"></canvas>
<p>Klawiatura: strzałki · Spacja lub X: strzał · P: pauza · Enter: start<br>Telefon: przesuwaj palcem po ekranie gry</p>

<script>
// ===== Ustawienia =====
const canvas = document.getElementById('gra');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const SEG = 160;          // długość jednego odcinka rzeki (w pikselach świata)

// ===== Stan gry =====
let state = 'start';      // 'start' | 'play' | 'pause' | 'over'
let cam, plane, lives, score, bonus, rocks, rings, particles, segments, invuln, nextSpawn;
let bullets, shotCd;      // pociski samolotu i czas do następnego strzału
let popups = [];          // unoszące się napisy z punktami
const SHOT_DELAY = 0.2;   // co ile sekund można strzelić (przy trzymanej Spacji)
const SHOT_SPEED = 550;   // jak szybko pocisk leci w górę ekranu
const ROCK_POINTS = 10;   // punkty za rozbitą skałę
let best = 0;
try { best = Number(localStorage.getItem('lotNadRzeka_best')) || 0; } catch (e) {}

// Klawisze zapisujemy po e.code (fizyczny klawisz), więc działa przy każdym układzie klawiatury
const keys = {};
let wantShot = false;     // krótkie stuknięcie Spacji/X też odda strzał
const isShotKey = c => c === 'Space' || c === 'KeyX';
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || isShotKey(e.code)) e.preventDefault();
  if (isShotKey(e.code) && !e.repeat) wantShot = true;
  if ((e.code === 'Enter' || e.code === 'NumpadEnter') && (state === 'start' || state === 'over')) newGame();
  if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) {
    state = state === 'play' ? 'pause' : 'play';
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
// Po przełączeniu okna klawisze mogłyby "utknąć" wciśnięte
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ===== Sterowanie dotykiem (działa też myszą) =====
// Przesuwasz palec w dowolnym miejscu gry, a samolot przesuwa się o tyle samo,
// więc palec nie zasłania samolotu.
let drag = null;   // { px, py, ax, ay } = gdzie był palec i samolot na początku ruchu
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function anchorDrag(p) { drag = { px: p.x, py: p.y, ax: plane.x, ay: plane.y, tx: plane.x, ty: plane.y }; }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (state === 'start' || state === 'over') newGame();
  else if (state === 'pause') state = 'play';
  anchorDrag(pointerPos(e));
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pointerPos(e);
  drag.tx = drag.ax + (p.x - drag.px);
  drag.ty = drag.ay + (p.y - drag.py);
  drag.last = p;
});
// po puszczeniu palca samolot jeszcze dolatuje do wskazanego miejsca
const endDrag = () => { if (drag) drag.released = true; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// Pauza, gdy przełączysz kartę lub aplikację na telefonie
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') state = 'pause';
});

// ===== Rzeka =====
// Każdy odcinek ma: c = środek, w = połowa szerokości, iw = połowa szerokości wyspy (0 = brak)
function makeSegment(i) {
  if (i < 4) return { c: W / 2, w: 170, iw: 0 };
  const hard = Math.min(i / 120, 1);                 // trudność rośnie z dystansem
  const w = 75 + Math.random() * (120 - 50 * hard);  // szerokość rzeki
  const margin = 15;
  const prev = segments[i - 1];
  // środek przesuwa się najwyżej o 80 px na odcinek, żeby dało się nadążyć za zakrętem
  const minC = w + margin, maxC = W - w - margin;
  const c = Math.max(minC, Math.min(maxC, prev.c + (Math.random() * 2 - 1) * 80));
  let iw = 0;
  if (w > 120 && Math.random() < 0.35 + 0.2 * hard) iw = Math.min(w * 0.4, w - 55);
  return { c, w, iw };
}
function seg(i) {
  while (segments.length <= i) segments.push(makeSegment(segments.length));
  return segments[i];
}
function riverAt(wy) {
  const i = Math.floor(wy / SEG);
  let t = (wy - i * SEG) / SEG;
  t = t * t * (3 - 2 * t);                           // płynne przejście
  const a = seg(i), b = seg(i + 1);
  return { c: a.c + (b.c - a.c) * t, w: a.w + (b.w - a.w) * t, iw: a.iw + (b.iw - a.iw) * t };
}
function inWater(x, wy) {
  const r = riverAt(wy), d = Math.abs(x - r.c);
  return d < r.w && (r.iw < 1 || d > r.iw);   // iw < 1 = brak wyspy
}
// Losowy punkt w wodzie (w lewym lub prawym kanale, jeśli jest wyspa)
function randomWaterX(wy, pad) {
  const r = riverAt(wy);
  if (r.iw < 3) return r.c - r.w + pad + Math.random() * Math.max(0, 2 * (r.w - pad));
  const chW = r.w - r.iw - 2 * pad;
  const left = Math.random() < 0.5;
  const start = left ? r.c - r.w + pad : r.c + r.iw + pad;
  return start + Math.random() * Math.max(0, chW);
}
// Skały stawiamy tylko na szerokich fragmentach rzeki i zawsze z wolnym przejazdem obok.
const ROCK_MIN_WIDTH = 190;   // minimalna szerokość wody (bez wyspy), żeby postawić skałę
const ROCK_FREE_GAP = 80;     // tyle wolnej wody musi zostać obok skały
function placeRock(wy) {
  // rzeka musi być szeroka w całej okolicy skały, a nie tylko w jednym punkcie
  for (let d = -80; d <= 80; d += 20) {
    const r = riverAt(wy + d);
    if (r.iw > 0.5 || 2 * r.w < ROCK_MIN_WIDTH) return null;
  }
  const r = riverAt(wy);
  const rad = 10 + Math.random() * 8;
  for (let tries = 0; tries < 6; tries++) {
    const x = r.c - r.w + rad + 6 + Math.random() * (2 * r.w - 2 * rad - 12);
    const gapLeft = (x - rad) - (r.c - r.w), gapRight = (r.c + r.w) - (x + rad);
    if (Math.max(gapLeft, gapRight) >= ROCK_FREE_GAP) return { x, wy, r: rad };
  }
  return null;
}
function channelCenter(wy) {
  const r = riverAt(wy);
  return r.iw < 3 ? r.c : (r.c - r.w + r.c - r.iw) / 2;
}

// Zamiana współrzędnych: świat (wy rośnie w górę) -> ekran
const toScreenY = wy => H - (wy - cam);
const toWorldY = sy => cam + (H - sy);

// ===== Nowa gra =====
function newGame() {
  cam = 0; lives = 3; score = 0; bonus = 0;
  rocks = []; rings = []; particles = []; segments = [];
  bullets = []; shotCd = 0; wantShot = false; popups = [];
  plane = { x: W / 2, y: H - 110 };
  invuln = 1.5; nextSpawn = 400;
  state = 'play';
}

// ===== Logika =====
function update(dt) {
  // Sterowanie: lewo/prawo = na boki, góra/dół = do przodu/do tyłu
  const side = 260, fwd = 200;
  if (keys.ArrowLeft) plane.x -= side * dt;
  if (keys.ArrowRight) plane.x += side * dt;
  if (keys.ArrowUp) plane.y -= fwd * dt;
  if (keys.ArrowDown) plane.y += fwd * dt;
  if (drag) {
    // samolot goni pozycję palca, ale nie szybciej niż przy strzałkach (×1.3)
    const dx = drag.tx - plane.x, dy = drag.ty - plane.y;
    const mx = side * 1.3 * dt, my = fwd * 1.3 * dt;
    plane.x += Math.max(-mx, Math.min(mx, dx));
    plane.y += Math.max(-my, Math.min(my, dy));
    if (drag.released && Math.abs(dx) <= mx && Math.abs(dy) <= my) drag = null;
  }
  plane.x = Math.max(15, Math.min(W - 15, plane.x));
  plane.y = Math.max(120, Math.min(H - 40, plane.y));

  // Prędkość: rośnie z dystansem, a lot "do przodu" dodatkowo przyspiesza
  const base = Math.min(110 + cam * 0.012, 300);
  const speed = base + (H - 40 - plane.y) * 0.35;
  cam += speed * dt;
  score = Math.floor(cam / 10) + bonus;

  // Strzelanie: Spacja albo X (można trzymać)
  shotCd -= dt;
  if ((keys.Space || keys.KeyX || wantShot) && shotCd <= 0) {
    bullets.push({ x: plane.x, wy: toWorldY(plane.y - 18) });
    shotCd = SHOT_DELAY;
    wantShot = false;
  }
  // Pociski lecą w górę; znikają poza ekranem albo nad lądem
  for (const b of bullets) {
    b.wy += (speed + SHOT_SPEED) * dt;
    if (toScreenY(b.wy) < 34) b.dead = true;
    else if (!inWater(b.x, b.wy)) { b.dead = true; burst(b.x, toScreenY(b.wy), '#a1887f', 5); }
    else {
      const rock = rocks.find(o => !o.dead && Math.hypot(o.x - b.x, o.wy - b.wy) < o.r + 4);
      if (rock) {
        rock.dead = true; b.dead = true; bonus += ROCK_POINTS;
        burst(rock.x, toScreenY(rock.wy), '#9e9e9e', 18);
        popup(rock.x, toScreenY(rock.wy), '+' + ROCK_POINTS, '#e0e0e0');
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  rocks = rocks.filter(o => !o.dead);

  // Nowe skały i kółka pojawiają się nad ekranem
  while (nextSpawn < cam + H + 60) {
    const wy = nextSpawn;
    const rock = Math.random() < 0.55 ? placeRock(wy) : null;
    if (rock) rocks.push(rock);
    else rings.push({ x: randomWaterX(wy, 20), wy, got: false });
    nextSpawn += Math.max(90, 220 - cam * 0.004) * (0.6 + Math.random() * 0.8);
  }
  rocks = rocks.filter(o => toScreenY(o.wy) < H + 40);
  rings = rings.filter(o => toScreenY(o.wy) < H + 40 && !o.got);

  // Gwiazdki: +25 pkt za przelot
  const pwy = toWorldY(plane.y);
  for (const g of rings) {
    if (Math.hypot(g.x - plane.x, g.wy - pwy) < 26) {
      g.got = true; bonus += 25;
      burst(g.x, toScreenY(g.wy), '#ffd54a', 14);
      popup(g.x, toScreenY(g.wy), '+25', '#ffd54a');
    }
  }
  // Napisy z punktami unoszą się do góry i znikają
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  // Zderzenia (gdy nie ma chwilowej ochrony)
  if (invuln > 0) { invuln -= dt; }
  else {
    const pts = [[0, -16], [-15, 2], [15, 2], [0, 12], [-6, 12], [6, 12]];
    let hit = pts.some(([dx, dy]) => !inWater(plane.x + dx, toWorldY(plane.y + dy)));
    if (!hit) hit = rocks.some(o => Math.hypot(o.x - plane.x, o.wy - pwy) < o.r + 11);
    if (hit) crash();
  }

  // Cząsteczki (wybuchy, błyski)
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}

function crash() {
  burst(plane.x, plane.y, '#ff7043', 30);
  lives--;
  if (lives <= 0) {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('lotNadRzeka_best', best); } catch (e) {} }
    return;
  }
  // Odrodzenie na środku kanału i usunięcie pobliskich skał
  plane.y = H - 110;
  const wy = toWorldY(plane.y);
  plane.x = channelCenter(wy);
  rocks = rocks.filter(o => Math.abs(o.wy - wy) > 250);
  invuln = 2;
  // palec dalej na ekranie: liczymy ruch od nowa; palec puszczony: zatrzymujemy samolot
  if (drag && !drag.released && drag.last) anchorDrag(drag.last);
  else drag = null;
}

function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 0.9 }); }

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, color });
  }
}

// ===== Rysowanie =====
function drawWorld() {
  ctx.fillStyle = '#2f7d32';                 // ląd
  ctx.fillRect(0, 0, W, H);
  const step = 4;
  for (let y = 0; y < H; y += step) {
    const r = riverAt(toWorldY(y));
    ctx.fillStyle = '#1e88e5';               // woda
    ctx.fillRect(r.c - r.w, y, r.w * 2, step);
    ctx.fillStyle = '#90caf9';               // jasny brzeg wody
    ctx.fillRect(r.c - r.w, y, 3, step);
    ctx.fillRect(r.c + r.w - 3, y, 3, step);
    if (r.iw > 2) {
      ctx.fillStyle = '#c9b27c';             // piasek wyspy
      ctx.fillRect(r.c - r.iw, y, r.iw * 2, step);
      ctx.fillStyle = '#388e3c';             // trawa na wyspie
      ctx.fillRect(r.c - r.iw + 5, y, Math.max(0, r.iw * 2 - 10), step);
    }
  }
  // Skały
  for (const o of rocks) {
    const sy = toScreenY(o.wy);
    ctx.fillStyle = '#5d5d5d';
    ctx.beginPath(); ctx.arc(o.x, sy, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath(); ctx.arc(o.x - o.r * 0.3, sy - o.r * 0.3, o.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  // Złote gwiazdki (nagroda: zbierasz je przelotem)
  const t = performance.now() / 1000;
  for (const g of rings) drawStar(g.x, toScreenY(g.wy), 13, t * 2 + g.x);
  // Pociski
  ctx.fillStyle = '#fff59d';
  for (const b of bullets) ctx.fillRect(b.x - 1.5, toScreenY(b.wy) - 6, 3, 12);
}

// Pięcioramienna gwiazdka, która się obraca i lekko pulsuje
function drawStar(x, y, size, angle) {
  const s = size * (1 + 0.1 * Math.sin(angle * 2));
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.shadowColor = '#fff59d'; ctx.shadowBlur = 12;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? s : s * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffd54a'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#f57f17'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// Napisy "+25", "+10" unoszące się po zdobyciu punktów
function drawPopups() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px system-ui, sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x + 1, p.y + 1);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawPlane() {
  if (invuln > 0 && Math.floor(invuln * 10) % 2 === 0) return;   // miganie podczas ochrony
  const { x, y } = plane;
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath();                        // kadłub
  ctx.moveTo(x, y - 18); ctx.lineTo(x + 4, y - 8); ctx.lineTo(x + 4, y + 12);
  ctx.lineTo(x - 4, y + 12); ctx.lineTo(x - 4, y - 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f44336';
  ctx.fillRect(x - 16, y - 2, 32, 6);     // skrzydła
  ctx.fillRect(x - 8, y + 9, 16, 4);      // ogon
  ctx.fillStyle = '#263238';
  ctx.fillRect(x - 2, y - 10, 4, 5);      // kabina
}

function drawHud() {
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'left';  ctx.fillText('Punkty: ' + score, 10, 23);
  ctx.textAlign = 'center'; ctx.fillText('Rekord: ' + Math.max(best, score), W / 2, 23);
  ctx.textAlign = 'right'; ctx.fillText('Życia: ' + '♥'.repeat(Math.max(lives, 0)), W - 10, 23);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 1.5);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function overlay(title, lines) {
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.font = '18px system-ui, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 10 + i * 30));
}

function draw() {
  drawWorld();
  if (state !== 'over') drawPlane();
  drawParticles();
  drawPopups();
  drawHud();
  if (state === 'start') overlay('Lot nad Rzeką', [
    'Omijaj brzegi i wyspy, łap gwiazdki: +25',
    'Spacja lub X: strzał, rozbita skała: +10',
    '← → na boki, ↑ szybciej, ↓ wolniej',
    'lub przesuwaj palcem po ekranie',
    'Enter albo dotknij, aby zacząć'
  ]);
  if (state === 'pause') overlay('Pauza', ['Naciśnij P albo dotknij, aby grać dalej']);
  if (state === 'over') overlay('Koniec gry', [
    'Twój wynik: ' + score,
    'Rekord: ' + best,
    'Enter albo dotknij, aby zagrać jeszcze raz'
  ]);
}

// ===== Pętla gry =====
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state === 'play') update(dt);
  else for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  draw();
  requestAnimationFrame(loop);
}

newGame(); state = 'start';
requestAnimationFrame(loop);
</script>
</body>
</html>
