<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot nad Rzeką</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gra" width="480" height="640"></canvas>
<p id="stopka">Strzałki: lot · Spacja lub X: strzał · P: pauza · Enter: start · F: pełny ekran
  <button id="pelnyEkran" type="button">⛶ Pełny ekran</button>
  <br><small>Telefon: przesuwaj palcem po ekranie gry · wersja 1.9.1 (szersza rzeka)</small></p>
<div id="panel" class="ukryty"><div class="okno" id="okno"></div></div>

<script src="src/screen.js"></script>
<script src="src/input.js"></script>
<script src="src/river.js"></script>
<script src="src/obstacles.js"></script>
<script src="src/game.js"></script>
<script src="src/combat.js"></script>
<script src="src/render-world.js"></script>
<script src="src/render-objects.js"></script>
<script src="src/render-plane.js"></script>
<script>
function drawHud() {
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.textAlign = 'left';  ctx.fillText('Punkty: ' + score, 10, 23);
  const rec = 'Rekord: ' + Math.max(bestScore(), score);
  if (players.length > 1 && players[turn]) {
    // kilku graczy: na środku imię, rekord w drugim, mniejszym wierszu
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54a';
    ctx.fillText(`${players[turn].name} (${turn + 1}/${players.length})`, W / 2, 23);
    ctx.font = 'bold 14px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 34, 130, 22);
    ctx.fillStyle = '#ddd'; ctx.fillText(rec, 10, 50);
    ctx.font = 'bold 18px system-ui, sans-serif'; ctx.fillStyle = '#fff';
  } else {
    ctx.textAlign = 'center'; ctx.fillText(rec, W / 2, 23);
  }
  ctx.textAlign = 'right'; ctx.fillText('Życia: ' + '♥'.repeat(Math.max(lives, 0)), W - 10, 23);
}

function drawParticles() {
  for (const p of particles) {
    if (p.ring) {                                   // fala uderzeniowa
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.strokeStyle = '#fff3e0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, (0.5 - p.life) * 140 + 6, 0, Math.PI * 2); ctx.stroke();
      continue;
    }
    if (p.smoke) {                                  // dym rośnie i blednie
      ctx.globalAlpha = Math.max(0, p.life * 0.5);
      circle(p.x, p.y, p.size * (2 - p.life), p.color);
      continue;
    }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.8));
    circle(p.x, p.y, (p.size || 2) * (0.5 + p.life), p.color);
  }
  ctx.globalAlpha = 1;
}

function overlay(title, lines) {
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.font = '18px system-ui, sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 10 + i * 30));
}

function draw() {
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  drawWorld();
  if (state === 'play' || state === 'pause') drawPlane();
  drawParticles();
  drawPopups();
  if (state !== 'menu' && state !== 'results') drawHud();
  if (state === 'menu' || state === 'results') { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'pause') overlay('Pauza', ['Naciśnij P albo dotknij, aby grać dalej', 'M: menu (zmiana graczy i imion)']);
  if (state === 'next') {
    const prev = players[turn - 1], now = players[turn];
    overlay('Koniec tury', [
      `${prev.name}: ${prev.score} pkt`,
      '',
      `Teraz gra: ${now.name} (${turn + 1}/${players.length})`,
      'Enter albo dotknij, aby zacząć',
      'M: menu (zmiana graczy i imion)'
    ]);
  }
}

// ===== Pętla gry =====
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state === 'play') update(dt);
  else {
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  // nawet gdyby rysowanie kiedyś rzuciło błąd, pętla gry działa dalej
  requestAnimationFrame(loop);
  try { draw(); } catch (e) { console.error(e); }
}

// ===== Gracze, tury i tabela rekordów =====
// Gra dla 1–4 osób po kolei (każdy ma swoją turę z 3 życiami).
// Rekordy zapisują się w przeglądarce (localStorage), więc zostają po zamknięciu strony.
const TOP_KEY = 'lotNadRzeka_top', NAMES_KEY = 'lotNadRzeka_names';
let players = [{ name: 'Gracz 1', score: 0 }];
let turn = 0;
let menuCount = 1;
let menuNames = ['Gracz 1', 'Gracz 2', 'Gracz 3', 'Gracz 4'];
let topList = [];             // najlepsze wyniki: [{ name, score, date }]
let personal = {};        // rekord każdego gracza: { imię: punkty }
let lastRound = [];       // wyniki ostatniej rundy (do ekranu wyników)

function loadRecords() {
  try {
    const saved = JSON.parse(localStorage.getItem(TOP_KEY) || 'null');
    if (saved) { topList = saved.top || []; personal = saved.personal || {}; }
    else {
      // przeniesienie dawnego rekordu z wersji dla 1 gracza
      const old = Number(localStorage.getItem('lotNadRzeka_best')) || 0;
      if (old > 0) topList = [{ name: 'Dawny rekord', score: old, date: '' }];
    }
    const names = JSON.parse(localStorage.getItem(NAMES_KEY) || 'null');
    if (names) { menuCount = names.count || 1; names.list.forEach((n, i) => { if (n) menuNames[i] = n; }); }
  } catch (e) {}
}
function saveRecords() {
  try {
    localStorage.setItem(TOP_KEY, JSON.stringify({ top: topList, personal }));
    localStorage.setItem(NAMES_KEY, JSON.stringify({ count: menuCount, list: menuNames }));
  } catch (e) {}
}
const bestScore = () => (topList[0] ? topList[0].score : 0);
// zabezpieczenie: imię wstawiane do HTML nie może zawierać znaczników
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const panel = document.getElementById('panel'), okno = document.getElementById('okno');
function showPanel(html) { okno.innerHTML = html; panel.classList.remove('ukryty'); }
function hidePanel() { panel.classList.add('ukryty'); }

function topTable(limit, highlight = []) {
  if (!topList.length) return '<p>Jeszcze nikt nie zagrał. Bądź pierwszy!</p>';
  const rows = topList.slice(0, limit).map((t, i) =>
    `<tr${highlight.includes(t) ? ' class="zwyciezca"' : ''}><td>${i + 1}.</td><td>${esc(t.name)}</td><td class="liczba">${t.score}</td><td class="liczba">${esc(t.date)}</td></tr>`).join('');
  return `<table><tr><th>#</th><th>Gracz</th><th class="liczba">Punkty</th><th class="liczba">Data</th></tr>${rows}</table>`;
}

function showMenu() {
  state = 'menu';
  const countBtns = [1, 2, 3, 4].map(n => `<button type="button" data-n="${n}" class="${n === menuCount ? 'wybrany' : ''}">${n}</button>`).join('');
  const inputs = menuNames.slice(0, menuCount).map((n, i) =>
    `<label>Gracz ${i + 1}: <input data-i="${i}" maxlength="12" value="${esc(n)}"></label>`).join('');
  showPanel(`
    <h1>Lot nad Rzeką</h1>
    <div class="rzad">Liczba graczy: ${countBtns}</div>
    <div class="rzad">${inputs}</div>
    <p>Gracze grają po kolei, każdy ma 3 życia. Na końcu rundy zobaczycie wyniki i tabelę rekordów.</p>
    <div class="rzad"><button type="button" class="glowny" id="startBtn">▶ Start (Enter)</button></div>
    <h2>Sterowanie</h2>
    <p>← → na boki · ↑ szybciej · ↓ wolniej · Spacja lub X: strzał · P: pauza · F: pełny ekran</p>
    <h2>Punkty</h2>
    <p>gwiazdka 25 (przelotem) · skała 10 · pień 15 · boja 20 · wir 25 (2 trafienia, wciąga!) · głaz 50 (3 trafienia) ·
       armatka 40 (2 trafienia, czerwona lufa = zaraz strzeli) · kula z armatki 5</p>
    <h2>🏆 Najlepsze wyniki</h2>
    ${topTable(5)}
  `);
  okno.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => { readNames(); menuCount = Number(b.dataset.n); showMenu(); });
  okno.querySelectorAll('input').forEach(inp => {
    inp.oninput = () => { menuNames[inp.dataset.i] = inp.value; };
    inp.onfocus = () => inp.select();   // kliknięcie zaznacza stare imię, więc od razu wpisujesz nowe
  });
  document.getElementById('startBtn').onclick = startFromMenu;
}
function readNames() { okno.querySelectorAll('input').forEach(inp => { menuNames[inp.dataset.i] = inp.value; }); }

function startFromMenu() {
  if (state !== 'menu') return;
  readNames();
  players = menuNames.slice(0, menuCount).map((n, i) => ({ name: n.trim() || `Gracz ${i + 1}`, score: 0 }));
  saveRecords();
  if (document.activeElement) document.activeElement.blur();   // żeby Spacja nie "klikała" przycisków
  startRound();
}
function startRound() {
  for (const p of players) p.score = 0;
  turn = 0;
  startTurn();
}
function startTurn() {
  hidePanel();
  for (const k in keys) keys[k] = false;
  newGame();
}
// Koniec tury: zapisujemy wynik i przechodzimy do następnego gracza albo do wyników
function endTurn() {
  const p = players[turn];
  p.score = score;
  p.newRecord = score > (personal[p.name] || 0);
  if (p.newRecord) personal[p.name] = score;
  const d = new Date();
  const entry = { name: p.name, score, date: `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}` };
  p.entry = entry;
  if (score > 0) { topList.push(entry); topList.sort((a, b) => b.score - a.score); topList = topList.slice(0, 10); }
  saveRecords();
  turn++;
  if (turn < players.length) state = 'next';
  else showResults();
}
function showResults() {
  state = 'results';
  lastRound = [...players].sort((a, b) => b.score - a.score);
  const rows = lastRound.map((p, i) =>
    `<tr${i === 0 && players.length > 1 ? ' class="zwyciezca"' : ''}><td>${i === 0 && players.length > 1 ? '🏆' : i + 1 + '.'}</td><td>${esc(p.name)}</td>` +
    `<td class="liczba">${p.score}</td><td class="liczba">${personal[p.name] || 0}${p.newRecord ? '<span class="nowy">nowy rekord!</span>' : ''}</td></tr>`).join('');
  showPanel(`
    <h1>${players.length > 1 ? 'Wyniki rundy' : 'Koniec gry'}</h1>
    <table><tr><th>#</th><th>Gracz</th><th class="liczba">Punkty</th><th class="liczba">Rekord gracza</th></tr>${rows}</table>
    <div class="rzad" style="margin-top:14px">
      <button type="button" class="glowny" id="againBtn">↻ Zagraj jeszcze raz (Enter)</button>
      <button type="button" id="menuBtn">✎ Zmień graczy / imiona (M)</button>
    </div>
    <h2>🏆 Najlepsze wyniki (top 10)</h2>
    ${topTable(10, players.map(p => p.entry))}
    <div class="rzad" style="margin-top:12px"><button type="button" id="clearBtn">Wyczyść rekordy</button></div>
  `);
  document.getElementById('againBtn').onclick = () => { document.activeElement.blur(); startRound(); };
  document.getElementById('menuBtn').onclick = showMenu;
  document.getElementById('clearBtn').onclick = () => {
    if (confirm('Na pewno usunąć wszystkie rekordy? Tego nie da się cofnąć.')) { topList = []; personal = {}; saveRecords(); showResults(); }
  };
}

resize();
loadRecords();
newGame();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
